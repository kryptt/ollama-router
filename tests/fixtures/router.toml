# ollama-router policy — THE ONE FILE. Backends, spend boundary, failover
# and alias chains, all live.
#
# Out-of-band on purpose: this lives on NFS at
# /swarm/main/ai/ollama-router/router.toml (hostPath -> /etc/ollama-router),
# NOT in git. The spend boundary sits outside the deploy mechanism so
# tightening it never waits on a Fleet reconcile.
#
# Re-read every discovery cycle (60s) — edits land live, backend roster
# included. A file that fails to parse or validate keeps the PREVIOUS
# config entirely (never a partial apply, never fails open) and increments
# ollama_router_config_reloads_total{result="rejected"}.
# Write atomically: `cp router.toml router.toml.new && mv router.toml.new
# router.toml` — a torn read is a rejected reload.
#
# Which keys are live and which need a restart: see README.md
# "## Configuration".
#
# ── THE CONTRACT WITH CLIENTS ──────────────────────────────────────────────
# Clients name a PURPOSE (`auto:*`) or a SPECIFIC EMBEDDING MODEL (`embed:*`).
# They do not name chat models, and they do not encode effort in a model name
# — router 0.16.0 translates `reasoning_effort: none|minimal|low|medium|high`
# into llama.cpp's own spelling for the local backends, so depth is a request
# parameter now. Concrete model names still resolve (operators need them) and
# [fallbacks] below rescues the ones clients used to send.

# ── backends: DOCUMENT ORDER IS ROUTING PRIORITY ───────────────────────────
# The model map is first-writer-wins, so the backend declared first wins a
# colliding model name. Local, unmetered backends therefore come first and
# the metered/hosted ones last — reordering these tables moves the spend
# boundary.

# hr-main (CUDA): gemma4 e2b/e4b, GLM-4.6V, jina-code + qwen3 embeddings,
# whisper/qwen3-asr/chatterbox.
[[backends]]
name = "llama-swap-hr-main"
url = "http://llama-swap-hr-main.ai:8080"

# rh-anine (Vulkan): qwen3.6 effort tiers, gpt-oss, gemma4:26b,
# nemotron3-super, glm-5.2-rivoli, qwen3 embeddings.
[[backends]]
name = "llama-swap-rh-anine"
url = "http://llama-swap-rh-anine.ai:8080"

# Nous Portal — hosted and metered, reached through postern, which injects
# the API key so this pod holds no credential.
[[backends]]
name = "nous"
url = "https://inference-api.nousresearch.com"
external = true                          # => can never appear in a `local` alias
# The inbound router token means nothing to Nous; forwarding it would leak
# it to a third party and leave postern reconciling two auth headers.
strip_auth = true

# freellmapi aggregates free-tier hosted providers (its provider keys also
# live behind postern). Declared LAST on purpose: an earlier slot would let
# a colliding hosted model name silently steal traffic from the local
# backends. It is reached only through the router's own `auto:*` alias
# chains, never by raw model name.
[[backends]]
name = "freellmapi"
url = "https://freellmapi.hr-home.xyz"
external = true                          # => can never appear in a `local` alias

# ── fallbacks: concrete name -> alias ──────────────────────────────────────
# Consulted ONLY when no reachable backend serves the concrete name, and
# never once an alias chain has started. The target may itself be an alias,
# which is what every entry below uses: a client that still sends a raw
# model name gets the same free -> local -> paid walk as an alias caller
# instead of a single hop straight onto a metered backend.
#
# That is not theoretical. The old map sent `qwen3.6-medium` directly to
# `qwen/qwen3.8-27b`, and it fired 230 times in 30 days — every one a
# silent paid call standing in for a "local fallback".
#
# QUOTE EVERY KEY: every model name contains a `.`, and a bare
# `qwen3.6-low = "x"` is a TOML *dotted key* meaning `qwen3 = { "6-low" = ... }`.
#
# NOTE the deliberate omission: `jina-code-embeddings` has NO entry. Every
# possible stand-in has a different vector dimension (1536 vs 2560), and a
# silent swap would poison grepai's index. When hr-main is down, jina 404s.
# That is the correct failure.
[fallbacks]
# TRANSITIONAL — the pre-2026-08-26 alias names. Every client that still
# sends `memory`/`coder`/`vision`/etc. keeps working while it is migrated,
# because a fallback whose target is an alias enters that alias's chain.
# These are the ONLY entries here that are meant to be deleted: drop them
# once `ollama_router_unknown_model_requests_total` stops moving and every
# client in docs has been repointed.
"memory" = "auto:memory"
"financial" = "auto:financial"
"chat" = "auto"
"chat-smart" = "auto:smart"
"coder" = "auto:coding"
"vision" = "auto:vision"

# llama-swap-rh-anine (rh-anine, vulkan) — the qwen3.6 effort tiers
"qwen3.6-low" = "auto:fast"
"qwen3.6-medium" = "auto"
"qwen3.6" = "auto"
"qwen3.6:latest" = "auto"
"qwen3.6-high" = "auto:smart"
"qwen3.6-ultra" = "auto:smart"
"gpt-oss" = "auto"
"gpt-oss:latest" = "auto"
"gemma4:26b" = "auto"
"nemotron3-super" = "auto:smart"
"glm-5.2-rivoli" = "auto:smart"
# llama-swap-hr-main (hr-main)
"gemma4" = "auto:fast"
"gemma4:e2b" = "auto:fast"
"gemma4:e4b" = "auto:fast"
"haervwe/GLM-4.6V-Flash-9B" = "auto:vision"
"haervwe/GLM-4.6V-Flash-9B:latest" = "auto:vision"
"qwen3-embedding-4b" = "embed:qwen3"

# ── aliases: the public surface ────────────────────────────────────────────
# Each candidate is `<backend>/<model>`, split on the FIRST `/` so model ids
# keep their own slashes. Unreachable candidates are skipped without an
# upstream attempt; a candidate that answers 404/429/401/403/5xx advances the
# walk on the response head, before any body byte is forwarded.
#
# Ordering is per-role, not one rule:
#   - `local = true` chains are local-first because the data must not leave.
#   - `auto:vision` is local-first for the same reason (household camera
#     frames), not for speed.
#   - the heavy roles are hosted-first because they are measurably faster:
#     7d p95 was 21s on freellmapi/auto:coding vs 91s on qwen3.6-high.
#   - `auto` and `auto:fast` are local-first: gemma4:e4b answers in ~5s p95
#     and rh-anine is idle most of the day.
#
# There is no chain-level timeout. A chain of N candidates can take up to
# N x request_timeout, so keep chains short and put the flaky hop last.

# ---- privacy-pinned: this data never leaves the cluster ----
# `local = true` is re-proved on EVERY reload against the roster above:
# flipping a chained backend to `external = true` rejects the whole file.

# receipt-ledger: bank statements, receipts. Small models, cheapest first;
# batch workload, cold-loads are fine.
[aliases."auto:financial"]
local = true
chain = [
  "llama-swap-hr-main/gemma4:e2b",
  "llama-swap-hr-main/gemma4:e4b",
  "llama-swap-rh-anine/qwen3.6-low",
]

# hindsight + hr-home-palace: personal memory, financial classification.
# qwen3.6-medium first to match hindsight's tuned 800s timeout.
[aliases."auto:memory"]
local = true
chain = [
  "llama-swap-rh-anine/qwen3.6-medium",
  "llama-swap-hr-main/gemma4:e4b",
]

# ---- embeddings: ONE MODEL PER ALIAS, NEVER A MIXED CHAIN ----
# Embedding dimension is a hard lock on whatever index consumes it —
# hindsight's is enforced in schema (2560 needs vchord; pgvector's HNSW caps
# at 2000) and changing it means wiping memory_units. So an `embed:*` chain
# may only hop between backends serving the IDENTICAL model, never between
# two different embedders. The name says which model you get, on purpose.

# 2560-dim. The same GGUF on both nodes (shared /swarm/storage/ai/models),
# so this hop is dimension-safe and it is the only embedder in the fleet
# that survives a single-node outage.
[aliases."embed:qwen3"]
local = true
chain = [
  "llama-swap-hr-main/qwen3-embedding-4b",
  "llama-swap-rh-anine/qwen3-embedding-4b",
]

# 1536-dim, grepai's indexer. Single-homed on hr-main: one hop is all there
# is, and that is honest. Give it a second hop by adding the model to
# fleet/ai/llama-swap-rh-anine.yaml — NOT by pointing it at a different embedder.
[aliases."embed:jina-code"]
local = true
chain = [
  "llama-swap-hr-main/jina-code-embeddings",
]

# ---- purpose chains ----

# The default. Anything that just wants a competent answer.
[aliases."auto"]
chain = [
  "llama-swap-rh-anine/qwen3.6-medium",
  "freellmapi/auto",
  "nous/nousresearch/hermes-4-70b",
]

# Short turns, classification, tool-shaped work. Cheapest that can answer.
[aliases."auto:fast"]
chain = [
  "llama-swap-hr-main/gemma4:e4b",
  "llama-swap-rh-anine/qwen3.6-low",
  "freellmapi/auto",
  "nous/openai/gpt-oss-120b",
]

# Hard reasoning. Hosted first — the local high tier is ~4x slower.
[aliases."auto:smart"]
chain = [
  "freellmapi/auto",
  "llama-swap-rh-anine/qwen3.6-high",
  "nous/nousresearch/hermes-4-405b",
]

# Code. freellmapi's `coding` chain is a real named chain as of 0.8.7.
[aliases."auto:coding"]
chain = [
  "freellmapi/auto:coding",
  "llama-swap-rh-anine/qwen3.6-high",
  "nous/qwen/qwen3.8-max",
]

# Images. LOCAL FIRST: this is what Home Assistant's LLM Vision sends, and
# the frames are household camera captures.
[aliases."auto:vision"]
chain = [
  "llama-swap-hr-main/haervwe/GLM-4.6V-Flash-9B:latest",
  "freellmapi/auto:vision",
  "nous/z-ai/glm-4.6v",
]
